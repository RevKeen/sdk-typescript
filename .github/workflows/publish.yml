name: Publish reviewed TypeScript SDK

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: sdk-publish-typescript
  cancel-in-progress: false

jobs:
  detect-release:
    name: Detect and validate release candidate
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.release.outputs.release }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enforce publish-workflow credential isolation
        shell: bash
        run: |
          set -euo pipefail
          WORKFLOW=.github/workflows/publish.yml
          if grep -Eq '\$\{\{[[:space:]]*secrets\.' "$WORKFLOW"; then
            echo "::error::SDK publishing must not reference registry or repository secrets."
            exit 1
          fi
          if grep -Eq '^[[:space:]]+(NPM_TOKEN|NODE_AUTH_TOKEN|PACKAGIST_TOKEN|PYPI_TOKEN):' "$WORKFLOW"; then
            echo "::error::SDK publishing must not declare registry credential variables."
            exit 1
          fi
          if grep -Eq '^[[:space:]]+workflow_dispatch:' "$WORKFLOW"; then
            echo "::error::Out-of-band workflow_dispatch publishing is forbidden."
            exit 1
          fi

      - name: Parse release marker
        id: release
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [[ "$PR_HEAD_REF" != sdk-release/v* ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SUBJECT=$(git log -1 --format=%s)
          if [[ ! "$SUBJECT" =~ ^sdk\[release\]:\ ([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "::error::SDK candidate commits must use the exact sdk[release]: <semver> subject."
              exit 1
            fi
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="${BASH_REMATCH[1]}"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if [ "$SUBJECT" != "$PR_TITLE" ]; then
              echo "::error::SDK candidate PR title must equal its commit subject."
              exit 1
            fi
            if [ "$PR_HEAD_REF" != "sdk-release/v${VERSION}" ]; then
              echo "::error::SDK candidate branch must be sdk-release/v${VERSION}."
              exit 1
            fi
          fi

          test -f .revkeen-release.json
          SDK_VERSION="$VERSION" EXPECTED_LANGUAGE=typescript node --input-type=module <<'NODE'
          import fs from "node:fs";
          const manifest = JSON.parse(fs.readFileSync(".revkeen-release.json", "utf8"));
          if (manifest.schemaVersion !== 1) throw new Error("Unsupported .revkeen-release.json schema");
          if (manifest.language !== process.env.EXPECTED_LANGUAGE) throw new Error("Release manifest language mismatch");
          if (manifest.version !== process.env.SDK_VERSION) throw new Error("Release manifest version mismatch");
          if (manifest.source?.repository !== "RevKeen/revkeen") throw new Error("Release manifest source repository mismatch");
          if (!/^[0-9a-f]{40}$/.test(manifest.source?.sha || "")) throw new Error("Release manifest source SHA is invalid");
          if (manifest.source?.commitSubject !== `sdk[release]: ${process.env.SDK_VERSION}`) throw new Error("Release manifest source subject mismatch");
          NODE

          MANIFEST_SOURCE=$(node -p "require('./.revkeen-release.json').source.sha")
          SOURCE_SHA=$(git log -1 --format=%B | sed -n 's/^Source: //p' | tail -1)
          if [ "$SOURCE_SHA" != "$MANIFEST_SOURCE" ]; then
            echo "::error::Release commit Source trailer must match .revkeen-release.json."
            exit 1
          fi

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "::error::package.json version $PACKAGE_VERSION does not match release marker $VERSION."
            exit 1
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate SDK release candidate
    needs: detect-release
    if: needs.detect-release.outputs.release == 'true'
    runs-on: ubuntu-24.04
    # This job installs dependencies and runs their code to build dist/. It therefore holds no token that can
    # publish: only the workflow-level contents: read applies, and there is no id-token.
    outputs:
      dist_sha256: ${{ steps.dist.outputs.dist_sha256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install from the lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build dist/ from the audited source
        run: npm run build

      - name: Validate publishable package
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync("package.json", "utf8"));
          const targets = new Set([manifest.main, manifest.module, manifest.types]);
          const collect = (value) => {
            if (typeof value === "string") targets.add(value);
            else if (value && typeof value === "object") Object.values(value).forEach(collect);
          };
          collect(manifest.exports);
          const missing = [...targets].filter((target) => target && !existsSync(target));
          if (missing.length) throw new Error(`The build did not produce: ${missing.join(", ")}`);
          NODE
          npm pack --dry-run

      - name: Fingerprint dist/
        id: dist
        shell: bash
        run: |
          set -euo pipefail
          DIGEST=$(find dist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "dist_sha256=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Keep dist/ for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sdk-typescript-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Approve, tag, and publish TypeScript SDK
    needs:
      - detect-release
      - validate
    if: github.event_name == 'push' && needs.detect-release.outputs.release == 'true'
    runs-on: ubuntu-24.04
    environment: sdk-release-typescript
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Enforce reviewed release sentinel
        env:
          REVIEW_GATE: ${{ vars.SDK_RELEASE_REVIEW_GATE }}
        run: |
          if [ "$REVIEW_GATE" != "enabled" ]; then
            echo "::error::sdk-release-typescript is missing the reviewed release sentinel."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Verify npm trusted-publishing runtime
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const [major, minor] = process.versions.node.split(".").map(Number);
          if (major < 22 || (major === 22 && minor < 14)) {
            throw new Error("npm trusted publishing requires Node.js 22.14.0 or newer");
          }
          NODE
          NPM_VERSION=$(npm --version)
          IFS=. read -r NPM_MAJOR NPM_MINOR NPM_PATCH <<< "$NPM_VERSION"
          if [ "$NPM_MAJOR" -lt 11 ] || { [ "$NPM_MAJOR" -eq 11 ] && [ "$NPM_MINOR" -lt 5 ]; }; then
            echo "::error::npm trusted publishing requires npm 11.5.1 or newer; found $NPM_VERSION."
            exit 1
          fi

      - name: Fetch the dist/ built from this source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-typescript-dist
          path: dist

      - name: Verify dist/ is the validated build
        env:
          EXPECTED: ${{ needs.validate.outputs.dist_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL=$(find dist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          if [ -z "$EXPECTED" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::dist/ does not match the build the validate job fingerprinted (expected ${EXPECTED:-none}, got ${ACTUAL})."
            exit 1
          fi

      - name: Require unused npm version
        env:
          VERSION: ${{ needs.detect-release.outputs.version }}
        shell: bash
        run: |
          set +e
          OUTPUT=$(npm view "@revkeen/sdk@${VERSION}" version 2>&1)
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "::error::@revkeen/sdk@${VERSION} already exists."
            exit 1
          fi
          if ! grep -q "E404" <<< "$OUTPUT"; then
            echo "$OUTPUT"
            echo "::error::Could not prove that the npm version is unused."
            exit 1
          fi

      - name: Create immutable release tag
        env:
          VERSION: ${{ needs.detect-release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          git config user.name "RevKeen Bot"
          git config user.email "bot@revkeen.com"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
            test "$(git rev-list -n 1 "${TAG}")" = "$GITHUB_SHA"
          else
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Publish through npm trusted publishing
        run: npm publish --access public --provenance
